# --- Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'jaclu/tmux-menus'

# --- Prefix
# unbind C-b
# set -g prefix ¸
# bind ¸ send-prefix

# --- Core Settings
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -s set-clipboard on
set -g renumber-windows on

# Treat Ghostty's keyboard Context Menu / Option key as a tmux user key.
# See home/.config/ghostty/config: context_menu sends ESC [ 29 ~.
set -s user-keys[0] "\033[29~"
# Ghostty / modern terminals may encode Ctrl-Space as CSI u.
set -s user-keys[3] "\033[32;5u"
set -s user-keys[4] "\033[64;5u"

# --- Appearance
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_pane_border_status 'off'
set -g @catppuccin_pane_status_enabled 'off'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"

set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-bg default
set -g status-fg default

set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] 󰊠 #S #[bg=#000000,fg=#cba6f7]#[bg=#000000] "
set -g status-left-length 50
set -g status-left-style default

set -g status-right "#[bg=#6c7086,fg=#1e1e2e,bold] %H:%M "
set -g status-right-length 50
set -g status-right-style default

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#7a7c79,bg=#000000"
set -g window-status-current-style "fg=#000000,bg=#05a4f8"

# --- Plugin Options
set -g @continuum-restore 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
# Let tmux-sessionx install its own Ctrl-o binding when TPM loads the plugin.
# Binding the plugin's script path directly is brittle and shows exit 127 when
# the plugin is not installed or its layout/dependencies change.
set -g @sessionx-bind 'C-o'
set -g @sessionx-prefix 'off'
set -g @sessionx-window-width  '60%'
set -g @sessionx-window-height '40%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '35%'

set -g @resurrect-dir "$HOME/.tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim  'session'

# --- Reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Keybindings
# Open a pane context menu from the keyboard Context Menu / Option key.
set -s command-alias[100] 'pane-menu=display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -x P -y P \
  "Copy Pane Path" p { run-shell -b "\$HOME/.local/bin/tmux-copy-pane-path \"#{pane_id}\"" } \
  "" \
  "Horizontal Split" h { split-window -h } \
  "Vertical Split" v { split-window -v } \
  "" \
  "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } \
  "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } \
  "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } \
  "" \
  "Kill" X { kill-pane } \
  "Respawn" R { respawn-pane -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }'

bind -n User0 pane-menu  # Context Menu / Option key: ESC [ 29 ~

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n C-t new-window
bind -n C-q kill-window

# WASD
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R

bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Split
bind h split-window -h
bind v split-window -v

# Prev/next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Do not let Ctrl-Space/C-@ rename or close anything. Ctrl-Space is often
# encoded as C-@, so bind both to a harmless no-op instead of passing them
# through to the pane.
unbind -n C-Space
unbind -n C-@
bind -n C-Space display-message -d 1 ''
bind -n C-@ display-message -d 1 ''
bind -n User3 display-message -d 1 ''  # Ctrl-Space: ESC [ 32 ; 5 u
bind -n User4 display-message -d 1 ''  # Ctrl-@: ESC [ 64 ; 5 u

unbind -T prefix s
bind   -T prefix s choose-tree -sZ
bind O choose-tree -sZ

run '~/.tmux/plugins/tpm/tpm'
